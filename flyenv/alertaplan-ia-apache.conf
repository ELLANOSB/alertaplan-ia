# AlertaPlan IA · sitio local para el Apache de FlyEnv (puerto 8091)
# Generado por instalar.sh con la ruta real del proyecto.
Listen 8091
<VirtualHost *:8091>
    ServerName alertaplan-ia.test
    DocumentRoot "__RAIZ__/public"
    <Directory "__RAIZ__/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require local
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/tmp/phpwebstudy-php-cgi-83.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog "__LOGS__/alertaplan-ia-error.log"
</VirtualHost>
